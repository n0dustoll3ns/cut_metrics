# Память ограничена (общая RDP-машина, ~24GB RAM, мало свободного commit-лимита),
# поэтому сознательно занижаем JVM-аппетиты Gradle: -Xmx8G/4G metaspace приводили
# к System.OutOfMemoryException в flutter\bin\internal\update_engine_version.ps1
# и падению :app:compileFlutterBuildRelease.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Меньше параллельных воркеров — ниже пиковое потребление памяти при сборке.
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
